services:
  postgres:
    image: postgres:16-alpine
    container_name: prime-capital-db
    restart: unless-stopped
    ports:
      - "5434:5432"
    environment:
      POSTGRES_USER: prime
      POSTGRES_PASSWORD: prime_secret
      POSTGRES_DB: prime_capital
    volumes:
      - prime_capital_pg:/var/lib/postgresql/data

  minio:
    image: minio/minio:latest
    container_name: prime-capital-minio
    restart: unless-stopped
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: server /data --console-address ":9001"
    volumes:
      - prime_capital_minio:/data

volumes:
  prime_capital_pg:
  prime_capital_minio:
