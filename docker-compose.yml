services:
  postgres:
    image: postgres:16-alpine
    container_name: prime-capital-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: prime
      POSTGRES_PASSWORD: prime_secret
      POSTGRES_DB: prime_capital
    ports:
      - "5434:5432"
    volumes:
      - prime_capital_pg:/var/lib/postgresql/data

  backend:
    build: .
    container_name: prime-capital-backend
    restart: unless-stopped
    depends_on:
      - postgres
    env_file:
      - .env
    ports:
      - "3223:5000"
    volumes:
      - ./uploads:/app/uploads
    command: sh -c "npx prisma migrate deploy && node server.js"

volumes:
  prime_capital_pg:
  prime_capital_minio:
