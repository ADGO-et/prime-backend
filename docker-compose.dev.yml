services:
  postgres:
    image: postgres:16-alpine
    container_name: prime-capital-db
    restart: unless-stopped
    ports:
      - "5434:5432"
    environment:
      POSTGRES_USER: prime
      POSTGRES_PASSWORD: prime_secret
      POSTGRES_DB: prime_capital
    volumes:
      - prime_capital_pg:/var/lib/postgresql/data

volumes:
  prime_capital_pg:
